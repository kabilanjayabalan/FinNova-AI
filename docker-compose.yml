version: '3.8'

services:
  # ─── Database Services ───
  postgres:
    image: postgres:15-alpine
    container_name: finnova-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finnova-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Application Services ───
  ai-service:
    build:
      context: ./ai-service
    container_name: finnova-ai-service
    environment:
      - PORT=8001
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8001:8001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: finnova-backend
    environment:
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/investment_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8001
      - JWT_SECRET=${JWT_SECRET:-9A5F8E2B4C1D7A6F3E8B5C2D1A9F4E7B3C6D8A2F1E5B9C4D7A0F3E6B2C8D5A1F}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: finnova-frontend
    environment:
      - PORT=80
      # VITE vars are injected at build time, so for docker-compose we pass them in via args if needed.
      # But since they are baked into the image, we just rely on local proxy or absolute URLs.
      # We'll use Docker's build args if we need to pass them at build time.
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
